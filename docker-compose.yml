version: '3.8'

networks:
  app-net:
    driver: bridge

services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: RootPassword123!
      MYSQL_DATABASE: qlsv_db
    volumes:
      - ./app/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-net

  web:
    build: ./app
    container_name: web_app
    restart: always
    depends_on:
      - db
    networks:
      - app-net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_tool
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: RootPassword123!
    depends_on:
      - db
    networks:
      - app-net

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - app-net
